name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  # Despite the historical job id, this only lints/type-checks -- it never
  # installs requirements.txt or runs a test. See the `test` job below for
  # that; kept separate because it's fast and has no runtime dependencies of
  # its own, so it shouldn't wait on a slower dependency install.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # black is PINNED because it is the only gating check here, and an
          # unpinned formatter turns "did this branch change?" into "did black
          # release since the last run?". Both happened on 2026-08-22: a file
          # formatted locally with a newer black failed this job, and two files
          # this job has always accepted are ones a newer black would rewrite.
          # Nothing was wrong with either; the versions simply disagreed.
          #
          # Bump this deliberately, in its own commit, so the reformat lands
          # separately from whatever change happens to be in flight.
          pip install 'black==26.5.1' flake8 Flake8-pyproject mypy

      - name: Check code formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 .
        continue-on-error: true

      - name: Type-check with mypy
        run: mypy .
        continue-on-error: true

  # Installs the project's own dependencies (pyproject.toml) and runs the
  # repo's pytest suites. This is the check that would have caught, e.g., a
  # `numpy` pin that predates a function (`np.trapezoid`, NumPy>=2.0 only)
  # the code already calls -- nothing previously verified the dependency
  # spec was even installable, let alone that the tests behind it pass. See
  # issue #105.
  #
  # Scope is deliberately not "every test file in the repo" yet: reproduce/
  # test_dataset_loaders.py is a standalone script (calls sys.exit() at
  # import time) rather than a pytest suite, and ode_kernels/tests needs a
  # Cython build step (`python setup.py build_ext --inplace`, requiring
  # Cython, which isn't a project dependency) that hasn't been wired up here.
  # Both are legitimate follow-ups, tracked in #105.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pytest
        run: pip install pytest

      - name: Run research/least_action tests
        run: |
          if [ -d research/least_action ]; then
            pytest research/least_action -v
          else
            echo "research/least_action doesn't exist on this branch yet (lands with PR #24) -- nothing to run."
          fi
