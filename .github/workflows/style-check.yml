name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  # Despite the historical job id, this only lints/type-checks -- it never
  # installs requirements.txt or runs a test. See the `test` job below for
  # that; kept separate because it's fast and has no runtime dependencies of
  # its own, so it shouldn't wait on a slower dependency install.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # black is PINNED because it is the only gating check here, and an
          # unpinned formatter turns "did this branch change?" into "did black
          # release since the last run?". Both happened on 2026-08-22: a file
          # formatted locally with a newer black failed this job, and two files
          # this job has always accepted are ones a newer black would rewrite.
          # Nothing was wrong with either; the versions simply disagreed.
          #
          # Bump this deliberately, in its own commit, so the reformat lands
          # separately from whatever change happens to be in flight.
          pip install 'black==26.5.1' flake8 Flake8-pyproject mypy

      - name: Check code formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 .
        continue-on-error: true

      - name: Type-check with mypy
        run: mypy .
        continue-on-error: true

  # Installs the project's own dependencies (pyproject.toml) and runs the
  # repo's pytest suites. This is the check that would have caught, e.g., a
  # `numpy` pin that predates a function (`np.trapezoid`, NumPy>=2.0 only)
  # the code already calls -- nothing previously verified the dependency
  # spec was even installable, let alone that the tests behind it pass. See
  # issue #105.
  #
  # Scope is deliberately not "every test file in the repo" yet: reproduce/
  # test_dataset_loaders.py is a standalone script (calls sys.exit() at
  # import time) rather than a pytest suite, and ode_kernels/tests needs a
  # Cython build step (`python setup.py build_ext --inplace`, requiring
  # Cython, which isn't a project dependency) that hasn't been wired up here.
  # Both are legitimate follow-ups, tracked in #105.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pytest
        run: pip install pytest

      - name: Run research/least_action tests
        run: |
          if [ -d research/least_action ]; then
            pytest research/least_action -v
          else
            echo "research/least_action doesn't exist on this branch yet (lands with PR #24) -- nothing to run."
          fi

      # FuzzySystemsExperiments/, experiments/, and gated-minimax-selection/'s
      # pytest suites transitively import `tribblefis` from the pinned
      # tribble-fis submodule. It's its own independent uv project (own
      # pyproject.toml + uv.lock, per AGENTS.md's Environment section) --
      # not installed by `pip install -e ".[dev]"` above -- and its
      # tribble-clustering dependency has a known -march=native SIGILL on
      # some Actions runners (tribble-fis#124) that only the git-sourced
      # override recorded in tribble-fis's own uv.lock avoids. A plain
      # `pip install ./tribble-fis` would ignore that lock and fetch the
      # SIGILL-prone PyPI wheel instead, so this must go through `uv sync`.
      - name: Install uv
        run: pip install uv

      - name: Build the tribble-fis environment
        run: uv sync --project tribble-fis --extra dev

      # pandas/scipy/h5py aren't tribble-fis dependencies -- they're pulled
      # in here only because the root-level suites below need them and this
      # is the venv that also has tribblefis importable.
      - name: Add the extra packages the root-level suites need
        run: uv pip install --python tribble-fis/.venv/bin/python pandas scipy h5py

      - name: Run tribble-fis-dependent test suites
        run: |
          tribble-fis/.venv/bin/python -m pytest \
            FuzzySystemsExperiments experiments gated-minimax-selection -v
