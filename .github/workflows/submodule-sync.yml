name: Submodule Sync

# Twice-daily check for new commits on each submodule's own `main` branch.
# The submodule pins here are otherwise only bumped by hand, so upstream
# fixes (tribble-fis, optimizers, clustering) silently sit unused until
# someone remembers to `git submodule update --remote`. This keeps a single
# moving PR up to date instead: same branch every run, force-pushed, body
# replaced with whatever changed since the branch was last pushed.
#
# research/proposal-defense/ reads results out of these submodules, so any
# SHA bump here can change its numbers -- the PR body flags that explicitly
# rather than letting a silent submodule bump land unnoticed.

# Each submodule's own repo now pokes this workflow directly on every merge to
# its `main` (see notify-downstream.yml over there), so a fix propagates in
# under a minute instead of waiting up to twelve hours for the next poll. The
# cron stays as a backstop: it covers a lost dispatch, and it is the only path
# that works at all when DOWNSTREAM_SYNC_TOKEN is absent upstream.
on:
  repository_dispatch:
    types: [upstream-updated]
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Three submodules can merge at once and each dispatches here. Serialize rather
# than cancel: every run force-pushes the same branch, and a cancelled run drops
# that submodule's bump on the floor until the next cron.
concurrency:
  group: submodule-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/submodule-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          # A branch pushed with the automatic GITHUB_TOKEN opens a PR that
          # triggers no `pull_request` workflows -- GitHub suppresses that to
          # avoid recursion. This PR's whole purpose is to be the one safe
          # "merge me to get current" button, and a PR with zero checks cannot
          # serve that. Pushing as the PAT makes PR Checks run on it.
          token: ${{ secrets.DOWNSTREAM_SYNC_TOKEN || github.token }}

      - name: Warn if the PR will land without CI
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::DOWNSTREAM_SYNC_TOKEN is not set. The sync PR will be opened by github-actions, so PR Checks will NOT run on it -- verify it by hand before merging."
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to latest main and check for changes
        id: sync
        run: |
          set -euo pipefail

          declare -A OLD_SHA
          declare -A URL

          while read -r key path; do
            name=${key#submodule.}
            name=${name%.path}
            url=$(git config -f .gitmodules --get "submodule.$name.url")
            OLD_SHA["$path"]=$(git ls-tree HEAD "$path" | awk '{print $3}')
            URL["$path"]="$url"
          done < <(git config -f .gitmodules --get-regexp '\.path$')

          git submodule update --init --remote --merge

          BODY_FILE=$(mktemp)
          {
            echo "Automated submodule sync -- checks each submodule's \`main\` branch twice a day and bumps the pin here to match."
            echo
            echo "⚠️ These submodules are consumed by \`research/proposal-defense/\`. Please confirm nothing there needs updating (numbers, citations, generated tables) before merging."
            echo
            echo "Triggered by: \`${{ github.event_name }}\`${{ github.event.client_payload.repo && format(' from `{0}`', github.event.client_payload.repo) || '' }}"
            echo
            echo "> This branch is machine-owned and force-pushed on every upstream merge."
            echo "> Do not commit to it by hand -- your commit will be overwritten."
            echo
            echo "| Submodule | Old SHA | New SHA |"
            echo "|---|---|---|"
          } > "$BODY_FILE"

          changed=false
          for path in "${!OLD_SHA[@]}"; do
            old="${OLD_SHA[$path]}"
            new=$(git -C "$path" rev-parse HEAD)
            if [ "$old" != "$new" ]; then
              changed=true
              repo_path=$(echo "${URL[$path]}" | sed -E 's#https://github.com/##; s#\.git$##')
              compare="https://github.com/$repo_path/compare/$old...$new"
              echo "| \`$path\` | \`${old:0:7}\` | [\`${new:0:7}\`]($compare) |" >> "$BODY_FILE"
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Push the moving sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git checkout -B "$SYNC_BRANCH"
          git add tribble-fis tribble-opt tribble-cluster
          git commit -m "chore(submodules): sync to latest main"
          git push --force origin "$SYNC_BRANCH"

      - name: Open or update the sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "${{ steps.sync.outputs.body_file }}"
          else
            gh pr create \
              --title "chore(submodules): sync to latest main" \
              --body-file "${{ steps.sync.outputs.body_file }}" \
              --head "$SYNC_BRANCH" \
              --base main
          fi
