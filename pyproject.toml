[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grad-school"
version = "0.1.0"
description = "Graduate school research and coursework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "plotly~=6.0.1",
    "scipy~=1.15.2",
    "sympy~=1.14.0",
    "tqdm~=4.67.1",
    "joblib~=1.5.0",
    "pandas~=2.2.3",
    "scikit-learn~=1.6.1",
    "fuzzy-c-means",
    "xlrd",
    "matplotlib~=3.10.1",
    "ucimlrepo",
    # reproduce/dataset_specs.py reads reproduce/dataset_specs.yaml, and
    # research/proposal-defense/build_pdf.py treats an unreadable spec file as
    # FATAL (exit 1) so every reader of the proposal sees the same substituted
    # prose. Undeclared, that made the proposal build fail on any environment
    # created by the documented `pip install -e ".[dev]"`. CI never caught it
    # because no job runs build_pdf.py.
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    # Pinned to match .github/workflows/style-check.yml: an unpinned
    # formatter turns "did this branch change?" into "did black release
    # since the last run?" (that disagreement failed a job on 2026-08-22).
    "black==26.5.1",
    "flake8",
    "Flake8-pyproject",
    "mypy",
]
cuda = [
    "numba-cuda[cu12]",
]
# Semidefinite-programming solver stack. `research/least_action/fis_sos.py`
# is the only direct importer; six scripts reach it transitively
# (`demo_calibrate`, `demo_certified_policy`, `demo_pareto`, `demo_sos`,
# `verify_proxy`, `verify_sos_exact`). Nothing else in the repo -- including
# `research/least_action/test_smoke.py`, the only pytest suite CI runs --
# needs it, so it is kept out of `[project.dependencies]`: an ordinary
# `uv sync`, and the CI `test` job which installs `.[dev]`, should not pull
# clarabel/osqp/scs/ecos for one research thread. Install with
# `uv sync --extra sos` or `pip install -e ".[sos]"`.
sos = [
    "cvxpy",
]

[tool.black]
target-version = ["py311"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "build", "dist", ".eggs", ".tox", ".venv", ".hatch"]
extend-ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true

# The repo is a collection of research/coursework scripts, with ONE importable
# package: `repro_data`, the shared dataset loaders every reproducibility
# experiment imports (so a dataset's dropped columns / errata / leaky features
# are defined once and cannot drift between callers). Selecting it here is what
# makes `pip install -e .` / `uv sync` install `import repro_data` into the
# environment. Nothing else in the tree is a package; hatchling ships only
# `repro_data`, and `[project.dependencies]` above installs normally.
# (Before repro_data existed there was no package to select and this used
# `bypass-selection = true` to stop hatchling erroring on an empty wheel.)
[tool.hatch.build.targets.wheel]
packages = ["repro_data"]
