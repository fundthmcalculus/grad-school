[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grad-school"
version = "0.1.0"
description = "Graduate school research and coursework"
requires-python = ">=3.11"
dependencies = [
    "flake8",
    "black",
    "mypy",
    "numpy>=2.4.6",
    "plotly~=6.0.1",
    "scipy~=1.15.2",
    "sympy~=1.14.0",
    "tqdm~=4.67.1",
    "joblib~=1.5.0",
    "pandas~=2.2.3",
    "scikit-learn~=1.6.1",
    "fuzzy-c-means",
    "xlrd",
    "matplotlib~=3.10.1",
    "ucimlrepo",
    "numba-cuda[cu12]",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "Flake8-pyproject",
    "mypy",
]

# Code style: Black with default line length (88), matching the optimizers repo.
# target-version is pinned to the project's minimum (py311) so Black does not
# infer a newer grammar from requires-python and emit a spurious AST-safety
# warning on older interpreters.
[tool.black]
target-version = ["py311"]

# Lint: flake8 (via Flake8-pyproject), settings copied from the optimizers repo.
# max-line-length is 120 while Black formats to 88, so E501 only trips on lines
# Black cannot split. E203 is ignored because Black and pycodestyle disagree on
# whitespace before slice colons.
[tool.flake8]
max-line-length = 120
exclude = ".git,__pycache__,build,dist,.eggs,.tox,.venv,venv"
extend-ignore = ["E203"]

# Types: mypy. Lenient baseline for now — it catches genuine type errors without
# demanding full annotations. Strictness is intended to be ratcheted up over time.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
